<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizplosion - Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/main.css">

</head>

<body>
  <div id="app">
    <div id="dev-bar">
      <button id="reset-btn" class="dev-btn">Reset State</button>
      <!-- <button id="scoreboard-btn" class="dev-btn">Show Score Board</button> -->
    </div>

    <div class="screens">
      <!--MAIN MENU-->
      <div id="start-menu-screen" class="screen">
        <div class="start-menu">
          <h1 class="start-menu__title text--gradient text--glow">Quizplosion</h1>
          <div class="start-menu__actions">
            <button id="start-btn" class="btn btn--primary btn--large">Start</button>
            <button id="guide-btn" class="btn btn--secondary">Guide</button>
          </div>
        </div>
      </div>


      <!--SETUP-->
      <div id="setup-screen" class="screen">
        <div class="setup">
          <h2 class="setup__title text--white text--glow text--center text-2xl">Setup Teams</h2>

          <div class="setup__form input-group">
            <label class="setup__label" for="input-team-count">Number of teams:</label>
            <input type="number" id="input-team-count" min="2" max="10" value="3" class="input input--number">
          </div>

          <div id="team-name-inputs" class="team-inputs"></div>

          <div class="setup__actions">
            <button id="btn-play" class="btn btn--primary">Start Now</button>
            <button id="btn-back-to-menu" class="btn btn--secondary">Back</button>
          </div>
        </div>
      </div>

      <!--QUESTION MENU-->
      <div id="question-menu-screen" class="screen">
        <p class="text-lg text--gradient text--glow text--center" id="current-team-name">Turn of: Team A</p>
        <h2 class="text--white text--glow text--center text-2xl">Choose a question</h2>
        <div class="question-grid">
          <!--tạo động danh sách câu hỏi ở đây-->
        </div>
      </div>

      <!--NEW QUESTION-->
      <div id="question-screen" class="screen">
        <div class="question">
          <!-- Header -->
          <div class="question__header">
            <div class="turn-order">
              <div id="turn-order-bar" class="turn-order__list">
                <!-- JS will populate turn slots -->
              </div>
            </div>

            <div class="current-turn">
              <span class="current-turn__label">ACTIVE TURN</span>
              <div id="current-turn" class="current-turn__team"></div>
            </div>
          </div>

          <!-- Main Layout -->
          <div class="question__layout">

            <!-- Left Sidebar -->
            <div id="question-screen-left-sidebar" class="question__sidebar question__sidebar--left">
            </div>

            <!-- Center: Question -->
            <div class="question__main">
              <div class="question-card">
                <div id="question-content" class="question-card__text">
                </div>

                <div id="question-list-answers" class="question-card__answers">
                </div>

              </div>

              <div id="question-action-bar" class="question-actions">
                <button class="action-btn action-btn--close">Return Menu</button>
                <button class="action-btn action-btn--next">Show Question</button>
                <button class="action-btn action-btn--skip-turn">Skip Turn</button>
                <!-- <img class="action-btn action-btn--close" src="./assets/close_btn.png" alt="Close question">
                <img class="action-btn action-btn--next" src="./assets/next_btn.png" alt="Next question">
                <img class="action-btn action-btn--skip-turn" src="./assets/skip_turn_btn.png" alt="Skip Turn"> -->
              </div>
            </div>

            <!-- Right Sidebar -->
            <div id="question-screen-right-sidebar" class="question__sidebar question__sidebar--right">
            </div>
          </div>
        </div>
      </div>

      <!--COMMON CARD-->
      <div id="common-card-drawing-screen" class="screen">
        <div class="card-slide-container" id="list-slide-cards">
        </div>

        <!-- Action Buttons -->
        <img class="action-btn icon-right" id="question-menu-btn" src="./assets/menu.png" alt="Menu">
      </div>

      <!--RARE CARD-->
      <div id="rare-card-screen" class="screen">
        <div class="card-slide-container">
          <div class="card-container card-container--rare">
            <img class="card__image card__image--back" src="./assets/card_back.png" alt="Card Back">
            <img class="card__image card__image--rare" src="./assets/card_change.png" alt="Card Change">
          </div>
          <div class="team-info">
            <p class="text--gradient text--glow text-2xl text--center">YOU FOUND A RARE CARD!</p>
            <p class="text-xl text--white text--center">Reveal it or get 5?</p>
          </div>
        </div>

        <!-- Action Buttons -->
        <img class="action-btn icon-right" id="questionmenu-btn" src="./assets/menu.png" alt="Menu">
      </div>

      <!-- Ranking Screen -->
      <div id="ranking-screen"   class="screen team-container">
          <table id="team-table">
              <thead>
                  <tr>
                      <th>Name Team</th>
                      <th>Score</th>
                  </tr>
              </thead>
              <tbody id="team-table-body">
                  
              </tbody>
          </table>
      </div>
    </div>
  </div>

  <script type="module" src="./dist/app.js"></script>
  <script></script>
</body>

</html>
