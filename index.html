<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizplosion - Game</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>

<body>
  <div id="game-canvas">
    <button id="reset-btn">RESET STATE</button>
    <div id="scoreboard-container">
        <h3>Score Board</h3>
        <div id="score-list"></div>
    </div>
    <button id="scoreboard-btn">Show Score Board</button>
    <!--MAIN MENU-->
    <div id="start-menu-screen" class="screen">
      <div class="menu-container">
        <div class="menu-buttons">
          <button class="menu-button" id="start-btn">Start</button>
          <button class="menu-button" id="guide-btn">Guide</button>
        </div>
      </div>
    </div>
    
    <!--SETUP-->
    <div id="setup-screen" class="screen">
      <h2 class="text--white text--glow text--center text-2xl">Game Setup</h2>
        <div class="input-group">
            <label>Number of teams:</label>
            <input type="number" id="num-teams" min="2" max="10" value="3" onchange="renderTeamInputs()">
        </div>
        <div id="team-names-area"></div>
        <button id="play-btn">Play</button>
        <button>Return</button>
    </div>

    <!--QUESTION MENU-->
    <div id="question-menu-screen" class="screen">
      <p class="text-lg text--gradient text--glow text--center" id="current-team-name">Turn of: Team A</p>
      <h2 class="text--white text--glow text--center text-2xl">Choose a question</h2>
      <div class="question-container">
        <!--tạo động danh sách câu hỏi ở đây-->
      </div>
    </div>

    <div id="question-screen" class="screen">
      <!-- Top Banner -->
      <div class="top-banner">
        <div class="banner-container">
          <img class="top-banner-background" src="./assets/question_background.png" alt="Top Banner Background" />
          <p id="question-content" class="top-banner-text">Câu hỏi nằm ở đây</p>
        </div>
      </div>

      <!-- Main content -->
      <div class="content-container">
        <div class="content" id="list-answers">
          <!--câu trả lời ở đây-->
        </div>
      </div>

      <!-- Bottom Banner -->
      <div class="bottom-banner">
        <div class="banner-container">
          <img class="bottom-banner-background" src="./assets/answer_background.png" alt="Bottom Banner Background" />
          <p id="correct-answer" class="text--gradient text--glow bottom-banner-text text--center"></p>
        </div>
      </div>

      <!-- Action Buttons -->
      <img class="action-btn icon-left" id="close-question-btn" src="./assets/close_btn.png" alt="X">
      <img class="action-btn icon-right" id="next-question-btn" src="./assets/next_btn.png" alt="Next">
    </div>

    <!--RARE CARD-->
    <div id="rare-card-screen" class="screen">
      <div class="card-slide-container">
        <div class="card-container card-container--rare">
          <img class="card__image card__image--back" src="./assets/card_back.png" alt="Card Back">
          <!--CHƯA LÀM: tạo động bài hiếm tại đây-->
          <img class="card__image card__image--rare" src="./assets/card_change.png" alt="Card Change">
        </div>
        <div>
          <p class="text--gradient text--glow text-2xl text--center">YOU FOUND A RARE CARD!</p>
          <p class="text-xl text--white text--center">Reveal it or get 5 points?</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <img class="action-btn icon-right" src="./assets/menu.png" alt="Menu">
    </div>

    <!--SLIDE CARD-->
    <div id="common-card-drawing-screen" class="screen">
      <div class="card-slide-container" id="list-slide-cards">
        <!--thêm động bộ bài tại đây-->
      </div>

      <!-- Action Buttons -->
      <img class="action-btn icon-right" id="question-menu-btn" src="./assets/menu.png" alt="Menu">
    </div>
  </div>
  <script type="module" src="./dist/app.js"></script>
</body>

</html>
